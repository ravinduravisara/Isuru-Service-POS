name: isuru-pos-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isuru-pos-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-${DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: https://88.222.242.20:${PRODUCTION_HTTPS_PORT:-8443}
    volumes:
      - server_prod_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5050/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - isuru_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isuru-pos-prod-frontend
    restart: unless-stopped
    # Public HTTPS entry point on port 8443 without affecting ports 80, 443, or 8080
    ports:
      - "8443:8443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - isuru_prod_network

volumes:
  server_prod_uploads:
    name: isuru_pos_prod_uploads

networks:
  isuru_prod_network:
    name: isuru_pos_prod_net
    driver: bridge
