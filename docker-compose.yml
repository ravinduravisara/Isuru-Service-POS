version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: isuru-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: isuru_billing
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: isuru-server
    restart: always
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/isuru_billing
      JWT_SECRET: isuru_service_center_production_secure_token_secret
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: isuru-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
