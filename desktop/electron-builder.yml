# ==============================================================================
# ISURU SERVICE CENTER POS: ELECTRON BUILDER CONFIGURATION
# ==============================================================================
appId: com.isuru.pos.desktop
productName: ISURU Service POS
copyright: Copyright © 2026 ISURU Service Center
electronVersion: 33.2.1

npmRebuild: false
nodeGypRebuild: false
asar: true

directories:
  output: dist-installer
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources/assets
    to: assets
  - from: ../backend/dist
    to: backend/dist
  - from: ../backend/package.json
    to: backend/package.json
  - from: ../backend/prisma
    to: backend/prisma
  - from: ../backend/node_modules
    to: backend/node_modules
    filter:
      - "**/*"
      - "!**/.bin"
      - "!**/.bin/**"
      - "!**/.cache"
      - "!**/.cache/**"
      - "!**/test"
      - "!**/tests"
      - "!**/*.ts"
      - "!**/*.map"
  - from: ../backend/node_modules/.prisma
    to: backend/node_modules/.prisma
  - from: ../frontend/dist
    to: frontend/dist
  - from: windows/postgres/pgsql
    to: pgsql
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "ISURU-POS-Setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "ISURU Service POS"
  uninstallDisplayName: "ISURU Service POS"
  deleteAppDataOnUninstall: false
