<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting ISURU Service POS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .container {
      text-align: center;
      padding: 30px;
      max-width: 440px;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .logo-badge svg {
      width: 40px;
      height: 40px;
      color: white;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .spinner-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
    }
    .spinner {
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      min-height: 20px;
    }
    .offline-tag {
      margin-top: 24px;
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .error-box {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 12px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
    </div>
    <h1>ISURU Service POS</h1>
    <div class="subtitle">Automotive Workshop Billing & Management</div>

    <div class="spinner-wrapper" id="spinner">
      <div class="spinner"></div>
    </div>

    <div class="status-text" id="statusMessage">Initializing system components...</div>
    <div class="error-box" id="errorBox"></div>

    <div class="offline-tag">Local-First Desktop Engine</div>
  </div>

  <script>
    // Listen for progress messages from Electron main process
    if (window.electronStatus) {
      window.electronStatus.onMessage((msg) => {
        document.getElementById('statusMessage').innerText = msg;
      });
      window.electronStatus.onError((err) => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('statusMessage').innerText = 'Startup Initialization Failed';
        const box = document.getElementById('errorBox');
        box.style.display = 'block';
        box.innerText = err;
      });
    }
  </script>
</body>
</html>
