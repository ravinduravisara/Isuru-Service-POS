name: Windows Desktop Installer Build

on:
  workflow_dispatch:
  push:
    branches: [ windows-setup, main ]
    tags: [ 'v*-win' ]

concurrency:
  group: windows-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build ISURU-POS-Setup.exe (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root, Backend & Frontend Dependencies
        run: |
          npm ci || npm install
          cd backend && npm ci || npm install
          cd ../frontend && npm ci || npm install

      - name: Generate Prisma Windows Engine
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isuru_pos
        run: |
          cd backend
          npx prisma generate

      - name: Build Express Backend
        run: |
          cd backend
          npm run build

      - name: Build React Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Install Desktop Packaging Dependencies
        run: |
          cd desktop
          npm install

      - name: Download & Extract Portable Windows PostgreSQL 16
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/windows/postgres"
          $zipPath = "desktop/windows/postgres/temp_postgres.zip"
          Write-Host "Downloading Portable PostgreSQL 16 from EnterpriseDB..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-16.6-1-windows-x64-binaries.zip" -OutFile $zipPath
          Write-Host "Extracting PostgreSQL binaries..."
          Expand-Archive -Path $zipPath -DestinationPath "desktop/windows/postgres" -Force
          Remove-Item -Force $zipPath
          # Remove unneeded GUI admin tools and docs to optimize package size
          Remove-Item -Recurse -Force "desktop/windows/postgres/pgsql/pgAdmin 4" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "desktop/windows/postgres/pgsql/doc" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "desktop/windows/postgres/pgsql/symbols" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "desktop/windows/postgres/pgsql/include" -ErrorAction SilentlyContinue
          if (!(Test-Path "desktop/windows/postgres/pgsql/bin/postgres.exe")) {
            Write-Error "PostgreSQL extraction failed or postgres.exe was not found"
            exit 1
          }
          Write-Host "✔ PostgreSQL 16 successfully verified at desktop/windows/postgres/pgsql/bin/postgres.exe"

      - name: Compile Electron Main Process & Pre-build Staging
        run: |
          cd desktop
          npm run build:electron
          node scripts/prepare-build.mjs

      - name: Prune Backend Dev Dependencies for Production Packaging
        run: |
          cd backend
          npm prune --omit=dev

      - name: Package Windows NSIS Installer (electron-builder)
        run: |
          cd desktop
          npx electron-builder --win nsis --config electron-builder.yml --publish never

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          $installer = "desktop\dist-installer\ISURU-POS-Setup.exe"
          if (!(Test-Path $installer)) {
            Write-Error "Fatal: Expected installer was not generated at $installer"
            exit 1
          }
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          Set-Content -Path "desktop\dist-installer\ISURU-POS-Setup.exe.sha256" -Value $hash
          Write-Host "=========================================================="
          Write-Host "✔ Windows Installer successfully built: $installer"
          Write-Host "✔ SHA-256 Checksum: $hash"
          Write-Host "=========================================================="

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISURU-POS-Windows-Installer
          path: |
            desktop/dist-installer/ISURU-POS-Setup.exe
            desktop/dist-installer/ISURU-POS-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
