name: isuru-pos-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: isuru-pos-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Security: Database port 5432 is strictly private and NOT published to the host/internet
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - isuru_prod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isuru-pos-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: https://88.222.242.20:${PRODUCTION_HTTPS_PORT:-8443}
    volumes:
      - server_prod_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - isuru_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isuru-pos-prod-frontend
    restart: unless-stopped
    # Public HTTPS entry point on port 8443 without affecting ports 80, 443, or 8080
    ports:
      - "8443:8443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - isuru_prod_network

volumes:
  postgres_prod_data:
    name: isuru_pos_prod_pgdata
  server_prod_uploads:
    name: isuru_pos_prod_uploads

networks:
  isuru_prod_network:
    name: isuru_pos_prod_net
    driver: bridge
